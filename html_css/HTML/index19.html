<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 19</title>
</head>
<body>
    <form action = "index18.html" method = "post">
        <fieldset>
            <legend>Personal Information</legend>
            <label for = "name">Name</label>
            <input type = "text" placeholder = "Name" value = "Alex" id = "name">
            <label for = "pass">Password</label>
            <input type = "password" placeholder = "Password" id = "pass" minlength = "10" maxlength = "18" required>
            <label for = "male">Male</label>
            <input id = "male" type = "radio" name = "gender">
            <label for = "female">Female</label>
            <input id = "female" type = "radio" name = "gender">
        </fieldset>
        <fieldset>
            <legend>Preferences</legend>
            <label for = "cricket">Cricket</label>
            <input id = "cricket" type = "checkbox">
            <label for = "chess">Chess</label>
            <input id = "chess" type = "checkbox">
            <select>
                <option selected>Country</option>
                <option>India</option>
                <option>USA</option>
                <option>China</option>
                <option>Japan</option>
                <option>Norway</option>
                <option>Greece</option>
                <option>Germany</option>
                <option>Bhutan</option>
                <!--Enough I dont know how much I will write-->
            </select>
        </fieldset>
        <fieldset>
            <legend>Others</legend>
            <label for = "school_code">School Code</label>
            <input type = "text" value = "ABC1024" id = "school_code" readonly>
            <input type = "text" value = "Future feature" disabled>
            <button type = "submit">Submit</button>
        </fieldset>
    </form>
</body>
</html>
