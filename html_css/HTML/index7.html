<!--
========================================
DAY 7 - TABLES PART 1
========================================

WHAT IS A TABLE?

A table is used to display structured data in rows and columns.

Examples:
- Student marks
- Timetables
- Product prices
- Employee records
- Cricket scorecards

Think:

Name      Marks
Alex      95
Sam       88

This is structured data.

========================================
THE 4 KINGS OF TABLES
========================================

<table>
<tr>
<td>
<th>

Remember:

table -> contains everything

tr -> creates a row

td -> normal data cell

th -> heading cell

========================================
1. TABLE
========================================

<table>

</table>

Think:

"I am the entire table."

Everything belongs inside me.

========================================
2. TR
========================================

<tr>

</tr>

Meaning:

Table Row

Think:

"I create a horizontal row."

Example:

<tr>
    ...
</tr>

========================================
3. TD
========================================

<td>

</td>

Meaning:

Table Data

Think:

"I am normal data."

Example:

<td>95</td>

<td>HTML</td>

<td>Jabalpur</td>

========================================
4. TH
========================================

<th>

</th>

Meaning:

Table Header

Think:

"I describe this column or row."

Examples:

<th>Name</th>

<th>Marks</th>

<th>City</th>

========================================
FIRST TABLE
========================================

<table>
    <tr>
        <td>HTML</td>
        <td>CSS</td>
    </tr>
</table>

Mental picture:

+------+------+
| HTML | CSS  |
+------+------+

========================================
MULTIPLE ROWS
========================================

<table>
    <tr>
        <td>HTML</td>
        <td>CSS</td>
    </tr>

    <tr>
        <td>JS</td>
        <td>Python</td>
    </tr>
</table>

Picture:

+------+--------+
| HTML | CSS    |
+------+--------+
| JS   | Python |
+------+--------+

========================================
TABLE WITH HEADERS
========================================

<table>
    <tr>
        <th>Name</th>
        <th>Marks</th>
    </tr>

    <tr>
        <td>Alex</td>
        <td>95</td>
    </tr>

    <tr>
        <td>Sam</td>
        <td>88</td>
    </tr>
</table>

Picture:

+------+-------+
| Name | Marks |
+------+-------+
| Alex | 95    |
+------+-------+
| Sam  | 88    |
+------+-------+

========================================
WHY TH IS BETTER THAN TD
========================================

Visual Side:

- Usually bold
- Usually centered

Semantic Side:

- Announces header information
- Helps screen readers understand the table
- Describes what the data below means

Think:

th is to td

like

h1 is to p

Header vs Data

Heading vs Content

========================================
GLOBE ANALOGY
========================================

DAY SIDE (Visual)

- Bold text
- Centered text

NIGHT SIDE (Semantic)

- Header information
- Better accessibility

TH sits in the middle because
it helps both sides.

========================================
COMMON MISTAKE #1
========================================

WRONG:

<table>
    <td>HTML</td>
</table>

Reason:

td must live inside tr.

CORRECT:

<table>
    <tr>
        <td>HTML</td>
    </tr>
</table>

========================================
COMMON MISTAKE #2
========================================

WRONG:

<tr>
    <th>Alex</th>
    <th>95</th>
</tr>

Reason:

Alex and 95 are data.

Not headings.

CORRECT:

<tr>
    <td>Alex</td>
    <td>95</td>
</tr>

========================================
ROWS VS COLUMNS
========================================

ROW:

Horizontal

Example:

Name | Age | City

COLUMN:

Vertical

Example:

Name
Alex
Sam

========================================
MENTAL TREE
========================================

table
 └─ tr
     ├─ th
     ├─ th
     └─ th

table
 └─ tr
     ├─ td
     ├─ td
     └─ td

Remember:

table
  ↓
rows
  ↓
cells

========================================
DAY 7 KEYWORDS
========================================

table
tr
td
th

Table
Row
Column
Cell
Header

Structured Data

========================================
QUICK REVISION
========================================

table = whole table

tr = table row

td = normal data

th = heading data

td must be inside tr

th should only be used for headings

Rows are horizontal

Columns are vertical

th helps both visual appearance
and semantics

========================================
END OF DAY 7 PART 1
========================================
-->
