==========================================================
DAY 23
HTML ENTITIES
==========================================================

Today we learn:

HTML Entities

A short topic.

But used everywhere.

==========================================================
THE PROBLEM
==========================================================

HTML uses special characters.

Examples:

<

>

"

&

These characters already have meaning.

Because of that:

The browser may misunderstand
what we write.

==========================================================
EXAMPLE
==========================================================

Suppose we write:

<p>5 < 10</p>

The browser sees:

<

and thinks:

A tag is starting.

Problem.

==========================================================
THE SOLUTION
==========================================================

Use entities.

Entities are special codes.

They display characters without
confusing HTML.

==========================================================
WHAT IS AN ENTITY
==========================================================

An entity starts with:

&

and ends with:

;

Example:

&lt;

Everything between:

&

and

;

has special meaning.

==========================================================
LESS THAN
==========================================================

Entity:

&lt;

Displays:

<

Example:

<p>5 &lt; 10</p>

Output:

5 < 10

Memory:

lt

Less Than

==========================================================
GREATER THAN
==========================================================

Entity:

&gt;

Displays:

>

Example:

<p>10 &gt; 5</p>

Output:

10 > 5

Memory:

gt

Greater Than

==========================================================
AMPERSAND
==========================================================

Character:

&

Official Name:

Ampersand

Entity:

&amp;

Displays:

&

Example:

<p>HTML &amp; CSS</p>

Output:

HTML & CSS

==========================================================
DOUBLE QUOTE
==========================================================

Character:

"

Entity:

&quot;

Displays:

"

Example:

<p>&quot;Hello&quot;</p>

Output:

"Hello"

Memory:

quot

Quote

==========================================================
COPYRIGHT SYMBOL
==========================================================

Character:

©

Entity:

&copy;

Displays:

©

Example:

<p>&copy; 2026</p>

Output:

© 2026

Memory:

copy

Copyright

==========================================================
REGISTERED SYMBOL
==========================================================

Character:

®

Entity:

&reg;

Displays:

®

Example:

<p>Logo Corporation &reg;</p>

Output:

Logo Corporation ®

Memory:

reg

Registered

==========================================================
NON BREAKING SPACE
==========================================================

Entity:

&nbsp;

Official Meaning:

Non Breaking Space

==========================================================
WHY IT EXISTS
==========================================================

Normally HTML collapses spaces.

Example:

Hello     World

may become:

Hello World

Multiple spaces become one.

==========================================================
NBSP
==========================================================

Example:

Hello&nbsp;&nbsp;&nbsp;World

Output:

Hello   World

==========================================================
IMPORTANT OBSERVATION
==========================================================

Using:

&nbsp;

20 times

is usually ugly.

Example:

Hello

&nbsp;
&nbsp;
&nbsp;
&nbsp;
&nbsp;

World

Works.

But not elegant.

==========================================================
PRE TAG
==========================================================

Sometimes:

<pre>

is better.

Example:

<pre>

Hello     World

</pre>

Output keeps spaces.

==========================================================
WHEN TO USE NBSP
==========================================================

Good:

Small spacing.

Keeping words together.

Example:

Mr.&nbsp;Smith

Without nbsp:

Mr.

Smith

might split across lines.

With nbsp:

They stay together.

==========================================================
WHEN TO USE PRE
==========================================================

Good for:

Code

Poems

ASCII Art

Diagrams

Keyboard layouts

Anything needing exact spacing.

==========================================================
ENTITY STRUCTURE
==========================================================

Every entity follows:

&name;

Starts with:

&

Ends with:

;

Example:

&lt;

&amp;

&copy;

==========================================================
ENTITY VS CHARACTER
==========================================================

Character:

<

Entity:

&lt;

----------------------------------------------------------

Character:

>

Entity:

&gt;

----------------------------------------------------------

Character:

&

Entity:

&amp;

==========================================================
COMMON BEGINNER MISTAKE
==========================================================

Wrong:

@copy;

Correct:

&copy;

Entities always begin with:

&

not:

@

==========================================================
ANOTHER BEGINNER MISTAKE
==========================================================

Wrong:

<p>5 < 10</p>

Correct:

<p>5 &lt; 10</p>

==========================================================
ANOTHER BEGINNER MISTAKE
==========================================================

Wrong:

HTML & CSS

inside some situations

Correct:

HTML &amp; CSS

==========================================================
REAL EXAMPLES
==========================================================

Example 1

<p>5 &lt; 10</p>

Output:

5 < 10

----------------------------------------------------------

Example 2

<p>10 &gt; 5</p>

Output:

10 > 5

----------------------------------------------------------

Example 3

<p>HTML &amp; CSS</p>

Output:

HTML & CSS

----------------------------------------------------------

Example 4

<p>&quot;Hello&quot;</p>

Output:

"Hello"

----------------------------------------------------------

Example 5

<p>&copy; 2026</p>

Output:

© 2026

----------------------------------------------------------

Example 6

<p>&reg;</p>

Output:

®

==========================================================
WHY ENTITIES MATTER
==========================================================

Without entities:

HTML may think special characters
are code.

With entities:

HTML knows they are text.

==========================================================

==========================================================

If a character has special meaning
in HTML:

Use an entity.
