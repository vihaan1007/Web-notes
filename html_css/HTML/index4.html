DAY 4 - LISTS
══════════════════════════════════════════════════════════════

Purpose:

Lists organize related items.

Lists provide structure.

Lists improve readability.

Lists improve semantics.

Lists improve accessibility.

══════════════════════════════════════════════════════════════
LIST TYPES
══════════════════════════════════════════════════════════════

ul

Unordered List

ol

Ordered List

dl

Description List

══════════════════════════════════════════════════════════════
UL - UNORDERED LIST
══════════════════════════════════════════════════════════════

Purpose:

Used when order does not matter.

Examples:

Shopping lists

Features

Skills

Ingredients

Common Structure:

<ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ul>

Browser usually displays bullets.

Meaning:

These items belong together.

══════════════════════════════════════════════════════════════
OL - ORDERED LIST
══════════════════════════════════════════════════════════════

Purpose:

Used when order matters.

Examples:

Recipes

Instructions

Rankings

Procedures

Common Structure:

<ol>
    <li>Step 1</li>
    <li>Step 2</li>
</ol>

Browser usually displays numbering.

Meaning:

Sequence matters.

══════════════════════════════════════════════════════════════
LI - LIST ITEM
══════════════════════════════════════════════════════════════

Purpose:

Represents one item in a list.

Common Parent Elements:

ul

ol

Meaning:

I am one item of a list.

══════════════════════════════════════════════════════════════
DESCRIPTION LISTS
══════════════════════════════════════════════════════════════

Tags:

dl

dt

dd

══════════════════════════════════════════════════════════════
DL
══════════════════════════════════════════════════════════════

Description List Container.

Holds terms and descriptions.

══════════════════════════════════════════════════════════════
DT
══════════════════════════════════════════════════════════════

Description Term.

Represents the thing being defined.

Example:

HTML

CSS

JavaScript

══════════════════════════════════════════════════════════════
DD
══════════════════════════════════════════════════════════════

Description Details.

Represents the explanation.

Example:

Creates webpage structure.

Styles webpages.

Adds interactivity.

══════════════════════════════════════════════════════════════
NESTED LISTS
══════════════════════════════════════════════════════════════

Meaning:

A list inside another list.

Examples:

ul inside ul

ol inside ol

ul inside ol

ol inside ul

Can theoretically continue indefinitely.

Used to represent hierarchy.

══════════════════════════════════════════════════════════════
SEMANTIC HTML THINKING
══════════════════════════════════════════════════════════════

Bad:

<p>HTML</p>
<p>CSS</p>
<p>JavaScript</p>

These are paragraphs.

Not a list.

Better:

<ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ul>

Meaning is preserved.

══════════════════════════════════════════════════════════════
ACCESSIBILITY BENEFITS
══════════════════════════════════════════════════════════════

Screen readers understand lists.

Many announce:

"List with X items"

before reading content.

Users gain structure information.

══════════════════════════════════════════════════════════════
SEO BENEFITS
══════════════════════════════════════════════════════════════

Lists help organize content.

Search engines understand structure better.

Useful for:

Features

Steps

Instructions

Documentation

══════════════════════════════════════════════════════════════
COMMON MISTAKES
══════════════════════════════════════════════════════════════

Mistake 1

Using paragraphs instead of lists.

Mistake 2

Using ol when order does not matter.

Mistake 3

Using ul when order matters.

Mistake 4

Forgetting li elements.

Mistake 5

Creating messy nesting.

══════════════════════════════════════════════════════════════
DAY 4 KEYWORDS
══════════════════════════════════════════════════════════════

ul

ol

li

SEO

DAY 4 SUMMARY
══════════════════════════════════════════════════════════════

ul = unordered list

ol = ordered list

li = list item

dl = description list

dt = description term

dd = description details

Nested lists create hierarchy.

Lists are better than paragraphs
when content is actually a list.
