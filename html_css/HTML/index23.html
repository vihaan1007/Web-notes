<!--

==========================================================
DAY 23
==========================================================

META + LINK TAGS

==========================================================
META TAG
==========================================================

Meta means:

Information about information.

Meta tags provide information
about the webpage.

==========================================================
LOCATION
==========================================================

Meta tags belong inside:

<head>

==========================================================
CHARSET
==========================================================

Syntax:

<meta charset="UTF-8">

Purpose:

Tells browser how to read characters.

==========================================================
WHY UTF-8
==========================================================

Supports:

English

Hindi

Emoji

Special symbols

Unicode characters

==========================================================
WITHOUT CHARSET
==========================================================

Characters may break.

==========================================================
VIEWPORT
==========================================================

Syntax:

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

Purpose:

Makes websites responsive.

==========================================================
WITHOUT VIEWPORT
==========================================================

Zoomed out mobile page.

Small text.

Bad experience.

==========================================================
DESCRIPTION
==========================================================

Syntax:

<meta name="description"
content="Page summary">

Purpose:

Provides page summary.

==========================================================
SEARCH ENGINES
==========================================================

Google may display this
in search results.

==========================================================
AUTHOR
==========================================================

Syntax:

<meta name="author"
content="Your Name">

Purpose:

Shows creator of page.

==========================================================
KEYWORDS
==========================================================

Syntax:

<meta name="keywords"
content="html, css, javascript">

Purpose:

Describes topics.

==========================================================
REFRESH
==========================================================

Syntax:

<meta http-equiv="refresh"
content="5">

Purpose:

Refresh page automatically.

==========================================================
LINK TAG
==========================================================

Link connects resources.

==========================================================
LOCATION
==========================================================

Inside:

<head>

==========================================================
STRUCTURE
==========================================================

<link rel="..."
href="...">

==========================================================
REL
==========================================================

Relationship.

Tells browser what resource is.

==========================================================
HREF
==========================================================

Location of resource.

==========================================================
STYLESHEET
==========================================================

<link rel="stylesheet"
href="style.css">

Purpose:

Connect CSS to HTML.

==========================================================
FAVICON
==========================================================

<link rel="icon"
href="favicon.png">

Purpose:

Shows icon in browser tab.

==========================================================
WITHOUT FAVICON
==========================================================

Default browser icon.

==========================================================
WITH FAVICON
==========================================================

Custom icon.

==========================================================
META VS LINK
==========================================================

META

=
Information

----------------------------------------------------------

LINK

=
Resources

==========================================================
MEMORY SHEET
==========================================================

charset

=
Character encoding

----------------------------------------------------------

viewport

=
Responsive design

----------------------------------------------------------

description

=
Page summary

----------------------------------------------------------

author

=
Page creator

----------------------------------------------------------

keywords

=
Topics

----------------------------------------------------------

stylesheet

=
Connect CSS

----------------------------------------------------------

icon

=
Favicon

==========================================================

-->
