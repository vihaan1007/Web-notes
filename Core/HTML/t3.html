<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/Core/Core/CSS/t3.css">
</head>

<body>
    <header>
        <h2 id="heading">
            Tic Tac Toe
        </h2>
    </header>
    <main>
        <section id="t">
            <table id="tab">
                <tr>
                    <td>
                        <button class="b" data-num="0"></button>
                    </td>
                    <td>
                        <button class="b" data-num="1"></button>
                    </td>
                    <td>
                        <button class="b" data-num="2"></button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button class="b" data-num="3"></button>
                    </td>
                    <td>
                        <button class="b" data-num="4"></button>
                    </td>
                    <td>
                        <button class="b" data-num="5"></button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button class="b" data-num="6"></button>
                    </td>
                    <td>
                        <button class="b" data-num="7"></button>
                    </td>
                    <td>
                        <button class="b" data-num="8"></button>
                    </td>
                </tr>
            </table>
        </section>
        <script src="/Core/Core/JS/tic_tac_toe.js">
        </script>
    </main>
</body>

</html>
